[workspace]
resolver = "3"
members = [
    "crates/sys",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/bootstrap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["proxyctl contributors"]
repository = "https://example.invalid/proxyctl"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
futures-core = "0.3"
serde = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
http = "1"
tempfile = "3"
nix = { version = "0.30", default-features = false }
# Metadata storage. `bundled` compiles SQLite in rather than linking a system
# library, so the agent does not depend on the distribution's sqlite version.
rusqlite = { version = "0.40", default-features = false }
# Level 2 validation needs to inspect the document's keys. `mihomo -t` cannot do
# this: it accepts unknown fields, so a mistyped key passes and the kernel falls
# back to a default. `serde_yaml` is marked deprecated upstream but remains the
# maintained-by-the-same-author, working implementation; its successor is not yet
# stable. Revisit when it is.
serde_yaml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

# Panicking helpers are banned per-crate via `#![cfg_attr(not(test), deny(...))]`
# in each crate root. They are deliberately NOT set here: a workspace-level
# `deny` cannot be relaxed for test builds, which would force every test fixture
# to thread `Result` around for no benefit.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
