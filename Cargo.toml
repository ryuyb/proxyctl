[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/bootstrap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["proxyctl contributors"]
repository = "https://example.invalid/proxyctl"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
futures-core = "0.3"
serde = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
http = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

# Panicking helpers are banned per-crate via `#![cfg_attr(not(test), deny(...))]`
# in each crate root. They are deliberately NOT set here: a workspace-level
# `deny` cannot be relaxed for test builds, which would force every test fixture
# to thread `Result` around for no benefit.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
