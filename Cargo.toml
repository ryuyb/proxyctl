[workspace]
resolver = "3"
members = [
    "crates/sys",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/interfaces",
    "crates/cli",
    "crates/bootstrap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["proxyctl contributors"]
repository = "https://example.invalid/proxyctl"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
futures-core = "0.3"
# The byte buffer type in reqwest's streaming API. Naming it is required to write
# the stream's type out; reqwest does not re-export it.
bytes = "1"
# The response type `hyper` produces, collected into memory by the Clash API
# relay. It is the interface between hyper's body trait and a `Vec<u8>`.
http-body-util = "0.1"
# `StreamExt::next` for the HTTP transport's stream loop. `futures-core` holds the
# traits only; the combinators live here. Already in the tree as a dependency of
# `async-stream`, so naming it adds no new code.
futures-util = { version = "0.3", default-features = false }
# Turns an `async` block containing `yield` into a `Stream`. Hand-writing the
# equivalent means a manual `poll_next` state machine, which for a read loop with
# a decoder and two branches is where the bugs would live; the macro keeps the
# control flow readable and needs no `unsafe`.
async-stream = "0.3"
serde = "1"
serde_json = "1"
# The deployment configuration file. `toml` is in the AGENTS.md baseline, and it
# is chosen over reusing `serde_yaml` below because a hand-edited config file
# benefits from TOML's explicit types: YAML's implicit conversion turns an
# unquoted `no` into a boolean and `1.0` into a float, which is a poor property
# for a file whose values are paths, ports, and a secret.
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
http = "1"
tempfile = "3"
nix = { version = "0.30", default-features = false }
# The HTTP interface. `axum` for routing, `hyper` for the connection loop: the
# server cannot use `axum::serve` because `SO_PEERCRED` must be read per
# connection, which `axum::serve` hides.
# `tokio` is required for streaming bodies: the log endpoint holds the connection
# open, and without it a `Body::from_stream` is unavailable.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# `client` is for the Clash API proxy: it forwards to the kernel's controller and
# must relay an HTTP/1.1 upgrade, which `hyper::client::conn` exposes and no
# pooled client does. `http1` stays for the same reason — an upgrade exists only
# in HTTP/1.1.
hyper = { version = "1", features = ["server", "client", "http1"] }
# `client` + `client-legacy` provide `hyper::client::conn::http1::handshake`: a
# client that hands back the *connection*, which is the requirement for relaying
# an upgrade. A pooled client cannot do it, because it keeps the socket and
# returns only a response.
hyper-util = { version = "0.1", features = ["tokio", "service", "client", "client-legacy"] }
# Metadata storage. `bundled` compiles SQLite in rather than linking a system
# library, so the agent does not depend on the distribution's sqlite version.
rusqlite = { version = "0.40", default-features = false }
# Level 2 validation needs to inspect the document's keys. `mihomo -t` cannot do
# this: it accepts unknown fields, so a mistyped key passes and the kernel falls
# back to a default. `serde_yaml` is marked deprecated upstream but remains the
# maintained-by-the-same-author, working implementation; its successor is not yet
# stable. Revisit when it is.
serde_yaml = "0.9"
# Verifying a downloaded kernel binary. `sha2` is RustCrypto's audited
# implementation; the digest it produces is what GitHub's release API publishes
# per asset, which is the only trustworthy checksum available upstream.
sha2 = "0.10"
# Decompressing the downloaded kernel artifact, which upstream publishes gzipped.
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Panicking helpers are banned per-crate via `#![cfg_attr(not(test), deny(...))]`
# in each crate root. They are deliberately NOT set here: a workspace-level
# `deny` cannot be relaxed for test builds, which would force every test fixture
# to thread `Result` around for no benefit.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
