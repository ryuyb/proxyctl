# The workspace root for the browser interfaces.
#
# Paths are relative to *this* file's directory, which is `frontend/` — so the
# glob is `admin`, not `frontend/admin`. Writing the latter would resolve to
# `frontend/frontend/admin` and silently match nothing, which pnpm reports only
# as "all 0 workspace projects" while exiting successfully.
#
# `admin` is the operator interface this repository builds and embeds. The
# dashboard is not a package here: it is fetched as a built artifact by
# `scripts/fetch-metacubexd.sh`, because building it would add a second Node
# toolchain and a Google Fonts dependency to the Rust build.
packages:
  - "admin"

# No `storeDir` here, deliberately.
#
# One was set while working on a machine where the default store location was not
# writable, which is a local environment fact rather than a property of this
# project. Committing it put the store in `/tmp` on CI, where the path does not
# exist for the caching step and every run failed in a post-action.
#
# A machine that needs it should set it in a *user-level* config
# (`~/.npmrc`, or `pnpm config set store-dir`), or export
# `PROXYCTL_PNPM_STORE`, rather than change this file for everyone.
