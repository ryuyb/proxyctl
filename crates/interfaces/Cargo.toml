[package]
name = "proxy-interfaces"
description = "HTTP interface adapters over the application use cases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "proxy_interfaces"
path = "src/lib.rs"

# An interface adapter: it turns application use cases into a transport and
# nothing more. It depends on the application and the domain's read-only types,
# never on infrastructure — that direction is what keeps an adapter replaceable.
[dependencies]
# For adopting a listening socket from the service manager, which needs
# `FromRawFd` — unsafe, and therefore confined to this crate.
proxy-sys = { path = "../sys" }
proxy-domain = { path = "../domain" }
proxy-application = { path = "../application" }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "io-util", "rt", "macros"] }
axum.workspace = true
# `StreamExt::map` for the streaming log body, and `stream!` for the event
# endpoint's select loop — an async generator is the only sane way to express
# "forward events, but also emit a heartbeat when none arrive".
futures-util = { workspace = true }
async-stream = { workspace = true }
hyper.workspace = true
hyper-util.workspace = true
tower = { version = "0.5", features = ["util"] }
# `cors` for the TCP listener's browser origins. `trace` and `limit` are already in
# use.
tower-http = { version = "0.7", features = ["trace", "limit", "cors"] }
# The peer credential is read through tokio's safe wrapper; no unsafe here.
nix = { workspace = true, features = ["user"] }
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tempfile.workspace = true
serde_json.workspace = true
proxy-application = { path = "../application", features = ["test-support"] }

[lints]
workspace = true
