[package]
name = "proxy-bootstrap"
description = "Composition root for the Mihomo management agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "proxy_bootstrap"
path = "src/lib.rs"

# The composition root is the only crate permitted to know both the application
# traits and concrete adapters. It contains no business logic: it selects
# implementations and hands them to the application layer.
[dependencies]
proxy-domain = { path = "../domain" }
proxy-application = { path = "../application" }
# The concrete adapters. This is the only crate permitted to depend on both the
# port traits and their implementations, which is what makes the dependency
# direction legitimate here and nowhere else.
proxy-infrastructure = { path = "../infrastructure" }
# The interface layer is composed here like any other adapter: it is started by
# the composition root, not by the application.
proxy-interfaces = { path = "../interfaces" }
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }

[features]
# Enables the in-memory adapter factory so composition can be verified without
# real adapters. Used by tests and by anyone bootstrapping a fake context.
test-doubles = ["proxy-application/test-doubles"]

[dev-dependencies]
# The in-memory doubles let the wiring be verified before any real adapter
# exists. Only the minimal set is requested; the fault-injection harness is for
# the application layer's own tests.
proxy-application = { path = "../application", features = ["test-doubles"] }
tempfile.workspace = true
# The lifecycle end-to-end test spawns processes and binds ports, so it needs the
# multi-threaded runtime and networking, not just the single-threaded timer set.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

[[test]]
name = "smoke"
required-features = ["test-doubles"]

[lints]
workspace = true
