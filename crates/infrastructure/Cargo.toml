[package]
name = "proxy-infrastructure"
description = "Adapters implementing the application ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "proxy_infrastructure"
path = "src/lib.rs"

# Adapters are where side effects live: HTTP, filesystem, process control. This
# is the only layer permitted to depend on those crates.
[dependencies]
proxy-domain = { path = "../domain" }
proxy-application = { path = "../application" }
thiserror.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["sync", "net", "time", "fs", "io-util", "process"] }
http = { workspace = true }
futures-core = { workspace = true }
# Signal delivery. Used instead of a hand-rolled `extern "C"` binding because
# this crate forbids unsafe code, and a wrapper crate is the honest way to get a
# syscall without weakening that guarantee for the whole layer.
nix = { workspace = true, features = ["signal"] }
# `rusqlite` is synchronous and `Connection` is not `Sync`, so adapters run it
# on the blocking pool behind a bounded connection set rather than sharing one
# connection behind a global mutex. See `storage` for why that matters.
rusqlite = { workspace = true, features = ["bundled"] }
# Atomic file replacement for configuration bodies: same-directory temp file
# plus rename is the only way the target is ever seen fully-old or fully-new.
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
# Enables the socket-permission helpers to be exercised without a real kernel.
socket-tests = []

[lints]
workspace = true
